<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Intch · Sales Funnel Diagnostic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<!--
  ВНИМАНИЕ:
  1) Все цифры в обучающих экранах — из четырёх отчётов 2026 года: McKinsey Global B2B
     Pulse 2026, Salesforce State of Sales (7th ed.), Deloitte Digital (янв. 2026),
     FedEx / C Space B2B trends 2026. Источник подписан под каждым экраном.
     Все они лежат в одной константе — EDU. Больше нигде цифр нет.
     Кейсов Intch здесь пока НЕТ — когда появятся реальные, добавлять сюда же с тэгом 'intch'.
  2) Линия бенчмарка на скоркарде (BENCH=72) — это НАША шкала, а не цифра из исследования.
  3) ONBOARDING_PATH и LEAD_SOURCE нужно согласовать с бэкендом, иначе register-lead
     вернёт 400, а атрибуция сломается. См. блок BACKEND INTEGRATION.
-->
<style>
  :root{
    --bg:linear-gradient(170deg, hsl(244,100%,98%) 0%, hsl(230,25%,97%) 55%, hsl(0,0%,100%) 100%);
    --bg2:hsl(0,0%,100%); --card:hsl(230,25%,96%); --card2:hsl(0,0%,100%);
    --ink:hsl(230,35%,12%); --muted:hsl(230,10%,45%);
    --accent:hsl(244,75%,60%); --accent2:hsl(258,80%,65%); --good:hsl(152,68%,42%);
    --warn:hsl(28,90%,55%);
    --soft:hsl(244,100%,97%); --grad:linear-gradient(135deg, hsl(244,75%,60%) 0%, hsl(258,80%,65%) 100%);
    --line:hsl(230,20%,90%); --shadow:0 20px 50px -20px hsl(244 75% 60% / .28), 0 10px 30px -15px hsl(230 35% 12% / .12);
  }
  *{box-sizing:border-box}
  html{margin:0;background:hsl(230,25%,97%)}
  body{margin:0;font-family:'Inter',ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--ink);background:var(--bg);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased}
  .app{width:100%;max-width:560px}
  .frame{background:var(--bg2);border:1px solid var(--line);border-radius:32px;box-shadow:var(--shadow);overflow:hidden;position:relative}
  .topbar{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
  .logo svg{height:22px;width:auto;display:block}
  .prog{flex:1;height:6px;background:hsl(230,20%,92%);border-radius:99px;overflow:hidden}
  .prog>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s cubic-bezier(.4,0,.2,1)}
  .pct{font-size:12px;color:var(--muted);min-width:34px;text-align:right}
  .backlink{color:var(--ink);cursor:pointer;font-size:22px;line-height:1;user-select:none;opacity:.6;padding-right:2px}
  .backlink:hover{opacity:1}
  .stage{padding:30px 26px 26px}

  /* ---------- signature element: the funnel rail ---------- */
  .frail{padding:15px 22px 13px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,hsl(244,100%,98.5%),hsl(0,0%,100%))}
  .frail svg{width:100%;height:auto;display:block;overflow:visible}
  .fseg{transition:.45s cubic-bezier(.4,0,.2,1)}
  .fseg.done{fill:url(#fgrad);opacity:.34}
  .fseg.now{fill:url(#fgrad);filter:url(#fglow)}
  .fseg.todo{fill:hsl(230,22%,91%)}
  .flabs{display:flex;gap:6px;margin-top:8px}
  .flab{flex:1;text-align:center;font-size:9px;letter-spacing:.4px;text-transform:uppercase;
    font-weight:700;color:hsl(230,14%,66%);line-height:1.2;transition:.3s}
  .flab.done{color:hsl(244,30%,64%)}
  .flab.now{color:var(--accent)}
  .fmeta{display:flex;justify-content:space-between;align-items:baseline;margin-top:11px;
    padding-top:10px;border-top:1px solid hsl(230,20%,94%)}
  .fmeta b{font-size:14px;font-weight:800;letter-spacing:-.01em}
  .fmeta span{font-size:11.5px;color:var(--muted);font-weight:600}
  @media(prefers-reduced-motion:reduce){.fseg{transition:none}}

  h1{font-size:30px;line-height:1.1;margin:0 0 12px;font-weight:800;letter-spacing:-.025em}
  h2{font-size:25px;line-height:1.16;margin:0 0 10px;font-weight:800;letter-spacing:-.02em}
  h2.center,h1.center{text-align:center}
  .kicker{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:14px}
  .kicker.soft{color:var(--muted)}
  p.sub{color:var(--muted);font-size:15px;line-height:1.55;margin:0 0 22px}
  p.sub.center{text-align:center}
  .opts{display:flex;flex-direction:column;gap:11px}
  .opt{display:flex;align-items:center;gap:13px;padding:16px 18px;border:1px solid var(--line);border-radius:18px;
    background:var(--card2);cursor:pointer;transition:.16s;font-size:15px;line-height:1.35;font-weight:500}
  .opt:hover{border-color:hsl(244 75% 60% / .5);background:var(--soft)}
  .opt.sel{border-color:var(--accent);background:var(--soft);box-shadow:0 0 0 1px var(--accent) inset}
  .opt .tick{width:22px;height:22px;border-radius:7px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;font-size:13px;color:transparent}
  .opt.sel .tick{background:var(--accent);border-color:var(--accent);color:#fff}
  input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--ink);padding:15px;font-size:15px;font-family:inherit}
  input:focus{outline:none;border-color:var(--accent)}
  .btn{margin-top:20px;width:100%;padding:17px;border:none;border-radius:999px;cursor:pointer;font-size:16px;
    font-weight:700;letter-spacing:-.01em;background:var(--grad);color:#fff;transition:.15s}
  .btn:hover{transform:translateY(-1px);box-shadow:0 16px 34px -12px hsl(244 75% 60% / .5)}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none;filter:saturate(.6)}
  .btn:focus-visible{outline:3px solid hsl(244 75% 60% / .45);outline-offset:2px}
  .btn.glow{animation:btnglow 2.4s ease-in-out infinite}
  @keyframes btnglow{0%,100%{box-shadow:0 0 0 rgba(108,92,231,0)}50%{box-shadow:0 0 30px rgba(108,92,231,.4)}}
  .card2{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
  .card2 h4{margin:0 0 8px;font-size:15px}
  .card2 p{margin:0;color:var(--muted);font-size:14px;line-height:1.55}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .foot a{color:var(--accent);text-decoration:none}
  .err{color:#E11D48;font-size:13px;text-align:center;margin-top:10px}
  .fade{animation:fade .45s ease}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* ---------- landing ---------- */
  .land{margin:-30px -26px -26px}
  .lhero{padding:44px 26px 34px;text-align:center;
    background:linear-gradient(170deg, hsl(244,100%,97.5%) 0%, hsl(248,100%,98.5%) 60%, hsl(0,0%,100%) 100%)}
  .lhero h1{font-size:32px;margin-bottom:14px}
  .lhero p.sub{font-size:15px;margin-bottom:18px}
  .wchips{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-bottom:22px}
  .wchip{background:hsl(244,100%,99%);border:1px solid hsl(244 75% 60% / .22);color:hsl(248,55%,42%);
    font-size:13px;font-weight:600;padding:9px 15px;border-radius:99px;line-height:1.3}
  .wchip b{color:var(--accent);font-weight:800}
  .lsec{padding:30px 26px}
  .lsec.alt{background:hsl(230,25%,97.5%);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .lsec h3{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
  .lsec .lsub{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 16px}
  .pain{background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:0 14px 14px 0;padding:14px 16px;margin-bottom:10px;font-size:14.5px;line-height:1.5}
  .lsec.alt .pain{background:#fff}
  .inside{display:flex;gap:13px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line)}
  .inside:last-child{border-bottom:none}
  .inum{width:26px;height:26px;border-radius:99px;background:var(--soft);border:1px solid hsl(244 75% 60% / .3);
    color:var(--accent);font-size:12px;font-weight:800;flex:none;display:grid;place-items:center}
  .inside b{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em}
  .inside p{margin:2px 0 0;font-size:13.5px;color:var(--muted);line-height:1.5}
  .statrow{display:flex;gap:10px;margin:4px 0 2px}
  .statbox{flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center}
  .statbox b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .statbox span{font-size:11px;color:var(--muted);font-weight:600;line-height:1.3;display:block;margin-top:3px}
  .lcta{padding:28px 26px 34px;text-align:center}

  /* ---------- education screen ---------- */
  .etag{display:inline-flex;align-items:center;gap:7px;border-radius:99px;padding:6px 13px;
    font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:18px}
  .etag.bench{background:var(--soft);border:1px solid hsl(244 75% 60% / .3);color:var(--accent)}
  .etag.intch{background:rgba(18,184,134,.12);border:1px solid rgba(18,184,134,.35);color:var(--good)}
  .estat{font-size:52px;font-weight:900;letter-spacing:-.045em;line-height:1;margin:0 0 12px;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .etag.intch ~ .estat{background:linear-gradient(135deg,hsl(152,68%,38%),hsl(170,60%,45%));
    -webkit-background-clip:text;background-clip:text}
  .esrc{font-size:11.5px;color:hsl(230,10%,60%);margin-top:16px;line-height:1.45}

  /* ---------- loader ---------- */
  .loader{display:grid;place-items:center;padding:14px 0 6px}
  .ring{width:60px;height:60px;border-radius:99px;border:5px solid rgba(24,22,60,.1);border-top-color:var(--accent);animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .checks{margin:20px 0 4px;display:flex;flex-direction:column;gap:12px}
  .crow{display:flex;align-items:center;gap:11px;font-size:15px;color:var(--muted);transition:.3s}
  .crow.done{color:var(--good)}
  .crow.active{color:var(--ink)}
  .cbox{width:22px;height:22px;border-radius:99px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;font-size:12px}
  .crow.done .cbox{background:var(--good);border-color:var(--good);color:#fff}

  /* ---------- scorecard ---------- */
  .scorehead{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 18px;margin-bottom:16px}
  .bignum{font-size:64px;font-weight:900;letter-spacing:-.05em;line-height:1;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .bignum small{font-size:22px;font-weight:800;color:hsl(230,14%,70%);-webkit-text-fill-color:hsl(230,14%,70%)}
  .verdict{font-size:15px;font-weight:700;margin-top:8px}
  .scorehead p{margin:6px 0 0;font-size:13.5px;color:var(--muted);line-height:1.5}
  .srow{margin:14px 0}
  .shead{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:600;margin-bottom:7px;color:var(--muted)}
  .shead b{color:var(--ink);font-size:13px}
  .strack{height:11px;background:hsl(230,20%,92%);border-radius:99px;position:relative}
  .strack>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));
    width:0;transition:width .9s cubic-bezier(.4,0,.2,1)}
  .strack>u{position:absolute;top:-3px;width:2px;height:17px;background:hsl(230,35%,12%);opacity:.35;border-radius:2px}
  .srow.weak .shead,.srow.weak .shead b{color:var(--warn)}
  .srow.weak .strack>i{background:linear-gradient(90deg,hsl(14,88%,58%),var(--warn))}
  .legend{display:flex;gap:16px;justify-content:center;font-size:11px;color:var(--muted);margin-top:14px}
  .legend i{display:inline-block;width:16px;height:3px;border-radius:2px;background:var(--accent);margin-right:5px;vertical-align:middle}
  .legend u{display:inline-block;width:2px;height:11px;background:hsl(230,35%,12%);opacity:.4;margin-right:6px;vertical-align:middle}
  .bottle{background:linear-gradient(160deg,hsl(28,100%,97%),#fff);border:1px solid hsl(28 90% 55% / .35);
    border-radius:20px;padding:20px;margin:18px 0 6px}
  .bottle .k{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;font-weight:800;color:var(--warn);margin-bottom:8px}
  .bottle h3{margin:0 0 8px;font-size:20px;letter-spacing:-.02em}
  .bottle p{margin:0;font-size:14.5px;line-height:1.55;color:hsl(230,20%,28%)}
  .fixes{margin-top:14px;display:flex;flex-direction:column;gap:10px}
  .fix{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45;color:hsl(230,20%,28%)}
  .fix .ck{width:20px;height:20px;border-radius:99px;background:rgba(18,184,134,.15);color:var(--good);
    flex:none;display:grid;place-items:center;font-size:12px;font-weight:800;margin-top:1px}
  .readiness{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:16px;margin-top:14px}
  .rdial{width:52px;height:52px;flex:none}
  .readiness b{display:block;font-size:15px;letter-spacing:-.01em}
  .readiness p{margin:2px 0 0;font-size:13px;color:var(--muted);line-height:1.45}

  /* ---------- pipeline / final ---------- */
  .pipe{margin:20px 0 6px}
  .pl-row{position:relative;display:flex;gap:16px;padding:0 0 24px}
  .pl-row:last-child{padding-bottom:0}
  .pl-row::before{content:"";position:absolute;left:15px;top:34px;bottom:-2px;width:2px;background:rgba(24,22,60,.14)}
  .pl-row:last-child::before{display:none}
  .pl-dot{width:32px;height:32px;border-radius:99px;border:2px solid var(--line);background:#fff;flex:none;
    display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--muted);z-index:1}
  .pl-row.done .pl-dot{background:var(--good);border-color:var(--good);color:#fff}
  .pl-row.next .pl-dot{border-color:var(--accent);color:var(--accent)}
  .pl-t{font-size:16px;font-weight:700}
  .pl-row.next .pl-t{color:var(--accent)}
  .pl-s{font-size:13px;color:var(--muted);margin-top:2px}
  .expo{position:relative;display:grid;place-items:center;padding:16px 0 2px}
  .expo-glow{position:absolute;width:200px;height:130px;background:radial-gradient(circle,rgba(108,92,231,.3),transparent 68%);filter:blur(6px)}
  .avstack{position:relative;display:flex;justify-content:center}
  .avc{width:60px;height:60px;border-radius:99px;border:3px solid #fff;display:grid;place-items:center;
    font-weight:800;font-size:21px;color:#fff;margin-left:-16px;box-shadow:0 6px 18px rgba(24,22,60,.16);animation:pop .4s ease backwards}
  .avc:nth-child(1){margin-left:0;animation-delay:.05s}.avc:nth-child(2){animation-delay:.15s}
  .avc:nth-child(3){animation-delay:.25s}.avc:nth-child(4){animation-delay:.35s}
  @keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
  .avc.more{background:var(--card);color:var(--muted);font-size:22px}
  .matched-badge{display:inline-flex;gap:6px;align-items:center;background:rgba(18,184,134,.12);
    border:1px solid rgba(18,184,134,.35);color:var(--good);font-size:12.5px;font-weight:700;padding:6px 13px;border-radius:99px;margin-top:8px}
  .pills{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:16px 0 2px}
  .pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-size:13px;font-weight:600}
  .leftcard{text-align:left;margin-top:14px}
  .clist{display:flex;flex-direction:column;gap:11px}
  .ci{display:flex;gap:11px;align-items:flex-start;font-size:14px;color:var(--muted);line-height:1.45}
  .ck{width:20px;height:20px;border-radius:99px;background:rgba(18,184,134,.15);color:var(--good);
    flex:none;display:grid;place-items:center;font-size:12px;font-weight:800;margin-top:1px}
  .devnote{max-width:560px;margin:14px auto 0;color:var(--muted);font-size:12px;text-align:center;line-height:1.5}
  @media(max-width:420px){.lhero{padding:34px 20px 28px}.lhero h1{font-size:27px}.stage{padding:26px 20px 22px}
    .lsec,.lcta{padding-left:20px;padding-right:20px}.land{margin:-26px -20px -22px}.flab{font-size:8px}}

  /* ---------- slider ---------- */
  .sld{margin:26px 0 6px}
  .sldval{text-align:center;font-size:54px;font-weight:900;letter-spacing:-.045em;line-height:1;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sldunit{text-align:center;font-size:13px;color:var(--muted);font-weight:600;margin-top:8px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:99px;
    background:hsl(230,20%,90%);margin-top:22px;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:99px;
    background:var(--accent);border:4px solid #fff;box-shadow:0 3px 12px hsl(244 75% 60% / .45);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:99px;background:var(--accent);
    border:4px solid #fff;box-shadow:0 3px 12px hsl(244 75% 60% / .45);cursor:pointer}
  .sldends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:9px;font-weight:600}
  /* ---------- multi select ---------- */
  .opt.multi .tick{border-radius:99px}
  .selcount{text-align:center;font-size:12.5px;color:var(--muted);margin-top:14px;font-weight:600}
  /* ---------- ranking ---------- */
  .rk{display:flex;align-items:center;gap:13px;padding:14px 16px;border:1px solid var(--line);
    border-radius:16px;background:var(--card2);cursor:pointer;transition:.16s;font-size:14.5px;
    line-height:1.35;font-weight:500;margin-bottom:10px}
  .rk:hover{border-color:hsl(244 75% 60% / .5);background:var(--soft)}
  .rk.on{border-color:var(--accent);background:var(--soft)}
  .rk .pos{width:28px;height:28px;border-radius:9px;flex:none;display:grid;place-items:center;
    font-size:13px;font-weight:800;background:hsl(230,20%,93%);color:var(--muted)}
  .rk.on .pos{background:var(--accent);color:#fff}
  /* ---------- guess reveal ---------- */
  .gcmp{display:flex;gap:12px;margin:18px 0 4px}
  .gbox{flex:1;border-radius:16px;padding:16px 14px;text-align:center;border:1px solid var(--line)}
  .gbox.you{background:var(--card)}
  .gbox.real{background:var(--soft);border-color:hsl(244 75% 60% / .35)}
  .gbox b{display:block;font-size:32px;font-weight:900;letter-spacing:-.04em;line-height:1}
  .gbox.real b{color:var(--accent)}
  .gbox span{display:block;font-size:11px;letter-spacing:.9px;text-transform:uppercase;
    color:var(--muted);font-weight:700;margin-top:8px}
  .know{display:flex;align-items:center;gap:14px;background:linear-gradient(160deg,var(--soft),#fff);
    border:1px solid hsl(244 75% 60% / .3);border-radius:16px;padding:16px;margin-top:14px}
  .know b{display:block;font-size:15px;letter-spacing:-.01em}
  .know p{margin:2px 0 0;font-size:13px;color:var(--muted);line-height:1.45}
  .yrs{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
  .yrs b{display:block;font-size:14px;margin-bottom:5px}
  .yrs p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.5}
</style>

function funnelRail(activeStage,qIndex,qTotal){
  var W=520,GAP=6,N=6,sw=(W-GAP*(N-1))/N,H0=62,H1=22,CY=35,segs='',i;
  for(i=0;i<N;i++){
    var x0=i*(sw+GAP),x1=x0+sw;
    var h0=H0-(H0-H1)*(x0/W),h1=H0-(H0-H1)*(x1/W);
    var st=i<activeStage?'done':(i===activeStage?'now':'todo');
    segs+='<polygon class="fseg '+st+'" points="'+x0+','+(CY-h0/2)+' '+x1+','+(CY-h1/2)+' '+x1+','+(CY+h1/2)+' '+x0+','+(CY+h0/2)+'"/>';
  }
  var labs=STAGES.map(function(s,i){
    var st=i<activeStage?'done':(i===activeStage?'now':'');
    return '<div class="flab '+st+'">'+s.short+'</div>';
  }).join('');
  return '<div class="frail">'+
    '<svg viewBox="0 0 520 70" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sales funnel progress">'+
      '<defs><linearGradient id="fgrad" x1="0" y1="0" x2="1" y2="0">'+
        '<stop offset="0" stop-color="hsl(244,75%,60%)"/><stop offset="1" stop-color="hsl(258,80%,65%)"/></linearGradient>'+
      '<filter id="fglow" x="-40%" y="-60%" width="180%" height="220%">'+
        '<feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="hsl(244,75%,60%)" flood-opacity=".45"/></filter></defs>'+
      segs+'</svg>'+
    '<div class="flabs">'+labs+'</div>'+
    '<div class="fmeta"><b>Stage '+(activeStage+1)+' \u00b7 '+STAGES[activeStage].name+'</b><span>Question '+qIndex+' of '+qTotal+'</span></div>'+
  '</div>';
}

       cur=cur.indexOf(v)>-1?cur.filter(function(x){return x!==v}):cur.concat([v]);}

}
function multiScreen(item){
  var sel=A[item.key]||[];

/* ================= SCORING ================= */
function qPoints(item){
  if(item.type==='multi')return multiPoints(item);
  return A[item.key+'_p']||0;
}
function qMax(item){
  if(item.type==='multi')return 50;
  return Math.max.apply(null,item.choices.map(function(c){return c.p}));
}
function stageScores(){
  var out={};
  STAGES.forEach(function(s,i){
    var items=Q.filter(function(q){return q.s===i});
    var max=items.reduce(function(a,q){return a+qMax(q)},0);
    var got=items.reduce(function(a,q){return a+qPoints(q)},0);
    out[s.id]=Math.round(got/max*100);
  });
  return out;
}
function overallScore(sc){
  var v=STAGES.map(function(s){return sc[s.id]});
  return Math.round(v.reduce(function(a,b){return a+b},0)/v.length);
}
function bottleneck(sc){
  var id=STAGES[0].id,lo=101;
  STAGES.forEach(function(s){if(sc[s.id]<lo){lo=sc[s.id];id=s.id;}});
  return id;
}
function knowledgeScore(){
  var keys=['guess_easy','guess_walkaway','guess_touches','win_factors','guess_selling'],t=0,n=0;
  keys.forEach(function(k){
    var g=GUESS[k];if(!g||A[k]==null)return;
    t+=g.score(A[k]);n++;
  });
  return n?Math.round(t/n):0;
}
function readiness(sc){return Math.round((sc.pitch+sc.follow+sc.team)/3);}
function leadScore(){
  var R={lt10:0,'10-50':18,'50-150':28,'150+':35}[A.revenue]||0;
  var T={'1-10':5,'11-30':14,'31-100':20,'100+':20}[A.team]||0;
  var U={now:25,quarter:16,year:8,explore:0}[A.urgency]||0;
  return R+T+U+20;
}
function leadSegment(){
  var p=leadScore(),seg=p>=70?'A':p>=45?'B':'V';
  if(A.urgency==='explore'&&p<60)seg='V';
  A.leadScore=p;A.leadSegment=seg;
  console.log('LEAD',{score:p,seg:seg,bottleneck:A.bottleneck,knowledge:A.knowledge});
  return seg;
}

      rows.forEach(function(r){var el=document.getElementById('cr'+r);if(!el)return;
        el.classList.remove('active');if(r<i)el.classList.add('done');if(r===i)el.classList.add('active');});
      i++;if(i>4){clearInterval(window._l);next();}
    };
    clearInterval(window._l);tick();window._l=setInterval(tick,850);
  },
  onLeave:function(){clearInterval(window._l)}});

    '<div class="know"><div><b>How well you know your market: '+kn+'/100</b><p>'+knText+'</p></div></div>'+
    '<div class="readiness">'+
      '<svg class="rdial" viewBox="0 0 50 50"><circle cx="25" cy="25" r="22" fill="none" stroke="hsl(230,20%,90%)" stroke-width="6"/>'+
      '<circle cx="25" cy="25" r="22" fill="none" stroke="hsl(244,75%,60%)" stroke-width="6" stroke-linecap="round" '+
      'stroke-dasharray="'+dash+' 999" transform="rotate(-90 25 25)"/>'+
      '<text x="25" y="29" text-anchor="middle" font-size="14" font-weight="800" fill="hsl(230,35%,12%)">'+rd+'</text></svg>'+
      '<div><b>Could someone else run this? '+rd+'/100</b><p>How much of your selling a new person could take over without you. Below 50 means you are the process.</p></div></div>'+
    (A.years?'<div class="yrs"><b>'+({lt1:'Under a year in this niche','1-2':'Two years in this niche','3-7':'Several years in this niche','8+':'Eight years or more in this niche'})[A.years]+'</b><p>'+YEARS[A.years]+'</p></div>':'')+
    '<button class="btn" onclick="next()">How do I fix this?</button></div>';},
  onShow:function(){setTimeout(function(){
    document.querySelectorAll('.strack>i').forEach(function(el){el.style.width=el.dataset.w+'%';});},80);}
});

/* ==================== BACKEND INTEGRATION (Intch) ====================
   Согласовать с бэкендом ДО запуска: ONBOARDING_PATH и LEAD_SOURCE. */
const API_BASE='';
const LOCALE='en';
const CATEGORY_TYPE='business';
const ONBOARDING_PATH='/onboarding/b2b-quiz/sales-funnel';   // TODO: зарегистрировать
const LEAD_SOURCE='b2b_quiz_sales_funnel';                   // TODO: завести enum
const DEV_BYPASS=(location.hostname.indexOf('intch.org')===-1);

const LEAD={uid:null,country_code:null};
const FB_LEAD_EVENT_ID=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():genUUID();
let leadRegistered=false;
function genUUID(){return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0,v=c==='x'?r:(r&0x3|0x8);return v.toString(16);});}

async function registerLead(){
  if(leadRegistered)return;leadRegistered=true;
  try{
    var u=API_BASE+'/service/register-lead/?locale='+encodeURIComponent(LOCALE)+'&lead_source='+encodeURIComponent(LEAD_SOURCE);
    var res=await fetch(u);if(!res.ok)return;var j=await res.json();
    LEAD.uid=j.uid||null;LEAD.country_code=j.country_code||null;
  }catch(e){console.warn('register-lead failed',e);}
}
function getUTM(){
  var utm={};
  try{new URL(window.location.href).searchParams.forEach(function(v,k){if(k.indexOf('utm_')===0)utm[k]=v;});}catch(e){}
  if(Object.keys(utm).length)return utm;
  var m=document.cookie.match(/(?:^|;\s*)first_utm=([^;]+)/);
  if(m){try{return JSON.parse(decodeURIComponent(m[1]));}catch(e){}}
  return null;
}
const ANSWER_MAP={
  niche:          ['s0_niche',        {saas:'saas',agency:'agency',ecom:'ecommerce',prod:'manufacturing',edu:'education',other:'other'}],
  leads_source:   ['s1_lead_source',  {referrals:'referrals',outbound:'outbound',inbound:'inbound',paid:'paid_ads',none:'no_source'}],
  leads_selfserve:['s2_self_serve',   {all:'full',some:'partial',none:'none'}],
  stall_owner:    ['s3_stall_owner',  {name:'known_person',role:'known_role',ask:'ask_contact',late:'too_late'}],
  pitch_tailor:   ['s4_tailoring',    {built:'rebuilt_per_buyer',swapped:'partly_swapped',same:'one_size'}],
  pitch_proof:    ['s5_value_proof',  {their:'their_numbers',typical:'typical_results',features:'features_price'}],
  follow_next:    ['s6_followup',     {booked:'next_step_booked',days:'few_days',remember:'ad_hoc',nothing:'none'}],
  follow_obj:     ['s7_objections',   {written:'written_practised',improvise:'improvised',dies:'deal_dies'}],
  cycle_len:      ['s8_cycle',        {week:'under_1w','2-4':'2_4w','1-2m':'1_2m','3m':'3m_plus',never:'not_measured'}],
  close_repeat:   ['s9_repeat',       {owned:'owned_process',touch:'ad_hoc_contact',wait:'passive',rare:'no_repeat'}],
  team_coach:     ['s10_coaching',    {weekly:'weekly_feedback',sometimes:'reactive',courses:'materials_only',none:'none'}],
  team_data:      ['s11_data',        {one:'single_system',plus:'system_plus_sheets',sheets:'spreadsheets',heads:'undocumented'}],
  guess_walkaway: ['s12_guess_walkaway',{price:'price',slow:'slow_delivery',incons:'inconsistent_answers',product:'product'}],
  years:          ['s13_years_in_niche',{lt1:'under_1',['1-2']:'1_2','3-7':'3_7','8+':'8_plus'}],
  revenue:        ['s14_revenue',     {lt10:'under_10k','10-50':'10_50k','50-150':'50_150k','150+':'150k_plus'}],
  team:           ['s15_team_size',   {'1-10':'1_10','11-30':'11_30','31-100':'31_100','100+':'100_plus'}],
  urgency:        ['s16_urgency',     {now:'now',quarter:'this_quarter',year:'this_year',explore:'exploring'}]
};
function mapAnswers(){
  var out={},k;
  for(k in ANSWER_MAP){var f=ANSWER_MAP[k][0],vm=ANSWER_MAP[k][1],v=A[k];
    if(v!=null&&vm[v]!=null)out[f]=vm[v];}
  return out;
}
function buildPayload(){
  var d={};
  d.email=(A.email||'').trim().toLowerCase();
  d.locale=LOCALE;d.category_type=CATEGORY_TYPE;d.onboarding_type=ONBOARDING_PATH;d.accepted_terms=true;
  if(LEAD.country_code)d.country_code=LEAD.country_code;
  if(FB_LEAD_EVENT_ID)d.fb_lead_event_id=FB_LEAD_EVENT_ID;
  var utm=getUTM();if(utm)d.first_utm=utm;
  var sc=stageScores();
  d.funnel_score=overallScore(sc);
  d.funnel_bottleneck=bottleneck(sc);
  d.market_knowledge_score=knowledgeScore();
  d.sales_manager_readiness=readiness(sc);
  d.stage_scores=sc;
  d.dmu_roles=(A.dmu_roles||[]).join(',');
  d.win_factors_rank=(A.win_factors||[]).join(',');
  d.guess_easy=A.guess_easy;
  d.guess_touches=A.guess_touches;
  d.guess_selling_time=A.guess_selling;
  Object.assign(d,mapAnswers());
  return d;
}
async function saveData(payload){
  var res=await fetch(API_BASE+'/api/v2/settings/setup/new-onboarding/save-data/',{
    method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:payload})});
  if(res.ok)return res.json();
  if(res.status===400)throw await res.json();
  throw new Error('API '+res.status);
}
function fireQuizLead(externalId){
  try{if(typeof fbq==='function')fbq('track','Lead',{external_id:externalId||undefined},{eventID:FB_LEAD_EVENT_ID});}catch(e){}
}
async function submitEmail(){
  var btn=document.getElementById('g'),err=document.getElementById('emailErr');
  var email=(A.email||'').trim().toLowerCase();
  if(!/.+@.+\..+/.test(email)){if(err){err.textContent='Enter a valid work email to see your scorecard.';err.style.display='block';}return;}
  A.email=email;if(err)err.style.display='none';
  btn.dataset.label=btn.dataset.label||btn.textContent;btn.disabled=true;btn.textContent='Sending\u2026';
  try{
    var resp=await saveData(buildPayload());
    fireQuizLead(resp&&resp.external_id);
    next();
  }catch(e){
    if(e&&e.error_code==='invalid_email'){if(err){err.textContent=e.error_message||'Enter a valid work email.';err.style.display='block';}}
    else if(e&&e.error_message){if(err){err.textContent=e.error_message;err.style.display='block';}}
    else if(DEV_BYPASS){console.warn('save-data unreachable \u2014 DEV_BYPASS on, advancing.',e);next();return;}
    else if(err){err.textContent='Something went wrong. Please try again.';err.style.display='block';}
    btn.disabled=false;btn.textContent=btn.dataset.label||'Show my scorecard';
  }
}

/* ================= ENGINE ================= */
function paint(){
  var scr=S[step];
  document.getElementById('stage').innerHTML=scr.render();
  var railEl=document.getElementById('rail');
  railEl.innerHTML=(scr.stage!=null)?funnelRail(scr.stage,scr.qi,QTOTAL):'';
  var total=S.length-1,pctv=Math.round((step/total)*100),hero=!!scr.hero;
  document.getElementById('progbar').style.width=(hero?0:pctv)+'%';
  document.getElementById('pct').textContent=(hero?0:pctv)+'%';
  var progEl=document.querySelector('.prog'),pctEl=document.getElementById('pct'),vis=hero?'hidden':'visible';
  if(progEl)progEl.style.visibility=vis;
  if(pctEl)pctEl.style.visibility=vis;
  document.getElementById('back').style.visibility=step>0?'visible':'hidden';
  window.scrollTo({top:0,behavior:'smooth'});
  if(scr.onShow)scr.onShow();
}
function next(){var s=S[step];if(s.onLeave)s.onLeave();if(step<S.length-1){step++;paint();}}
function prev(){var s=S[step];if(s.onLeave)s.onLeave();if(step>0){step--;paint();}}
paint();

['click','scroll','touchstart','keydown'].forEach(function(ev){window.addEventListener(ev,registerLead,{once:true,passive:true});});
setTimeout(registerLead,3500);
</script>
